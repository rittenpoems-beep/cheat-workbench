name: Snapshot Upstream Star Counts

# GitHub restricts stargazer timestamps for repositories where we are not
# collaborators. Keep the original chart as an archive and collect honest
# weekly public star-count observations instead.

on:
  schedule:
    - cron: '0 3 * * 1'      # every Monday 03:00 UTC
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/star-history.yml'
      - 'tools/record-star-count.py'

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record public upstream star count
        run: python3 tools/record-star-count.py

      - name: Commit snapshot if changed
        run: |
          if [[ -n "$(git status --porcelain docs/star-count-history.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/star-count-history.json
            git commit -m "chore: record weekly upstream stars [skip ci]"
            git push
          else
            echo "Star count snapshot unchanged — nothing to commit."
          fi
